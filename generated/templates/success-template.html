<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - BE SEEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/bez.css" rel="stylesheet">
    {{> analytics-loader}}
</head>
<body>
    {{> header-with-analytics}}

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="card">
                    <div class="card-body">
                        <h1 class="text-success mb-4">✅ Payment Successful!</h1>
                        <p class="lead">Thank you for your order. Your payment has been processed successfully.</p>
                        <p>Order ID: <span id="session-id"></span></p>
                        <p>You will receive a confirmation email shortly.</p>
                        <a href="/" class="btn btn-primary">Return to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{> footer}}

    <script>
        // Get session ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        if (sessionId) {
            document.getElementById('session-id').textContent = sessionId;
        }
        
        // Clear cart after successful payment
        if (window.cart) {
            cart.clearCart();
        }
    </script>
</body>
</html>

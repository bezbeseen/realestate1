<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Shopping Cart - BE SEEN</title>
    {{> seo}}
    {{> analytics-loader}}
    <link rel="stylesheet" type="text/css" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/fontawesome.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/style.css">
</head>
<body>
    {{> header-with-analytics}}

    <main>
        <section class="breadcrumb_section d-flex align-items-center clearfix" style="background-image: url('/assets/images/breadcrumb/bg_01.jpg');">
            <div class="container">
                <h1 class="page_title mb-0">Shopping Cart</h1>
            </div>
        </section>

        <section class="cart_section sec_ptb_130 clearfix">
            <div class="container">
                <div id="cart-container">
                    <!-- Cart items will be rendered here by cart-page.js -->
                </div>

                <div id="cart-empty" class="text-center" style="display: none;">
                    <h2>Your cart is empty.</h2>
                    <p class="lead">Looks like you haven't added anything to your cart yet.</p>
                    <a href="/products.html" class="btn btn-primary mt-3">Browse Products</a>
                </div>
            </div>
        </section>
    </main>

    {{> footer}}

    <script src="/assets/js/jquery-3.5.1.min.js"></script>
    <script src="/assets/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/cart.js"></script>
    <script src="/assets/js/cart-page.js"></script>
    <script src="/assets/js/main.js"></script>
</body>
</html>

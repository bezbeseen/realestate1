<!-- Yelp Business Optimization -->

<!-- Yelp Business Categories Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "additionalType": [
    "https://schema.org/PrintingService",
    "https://schema.org/SignMaking", 
    "https://schema.org/MarketingService"
  ],
  "name": "BE SEEN",
  "description": "Full-service printing company specializing in business marketing materials, real estate signage, and promotional products. Located in Santa Clara, serving all of Silicon Valley with premium printing solutions.",
  "keywords": [
    "printing services santa clara",
    "business cards santa clara", 
    "banners santa clara",
    "real estate signs",
    "promotional products silicon valley",
    "print shop santa clara",
    "marketing materials",
    "vinyl signs",
    "business signage"
  ],
  "paymentAccepted": ["Cash", "Credit Card", "Check", "PayPal"],
  "priceRange": "$$",
  "currenciesAccepted": "USD",
  "hasOfferCatalog": {
    "@type": "OfferCatalog",
    "name": "Yelp Featured Services",
    "itemListElement": [
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service",
          "name": "Real Estate Marketing Package",
          "description": "Complete marketing solution for real estate professionals including yard signs, business cards, flyers, and promotional materials",
          "category": "Real Estate Marketing"
        },
        "priceSpecification": {
          "@type": "PriceSpecification",
          "priceCurrency": "USD",
          "price": "Starting at $199"
        }
      },
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service", 
          "name": "Business Startup Print Package",
          "description": "Essential printing materials for new businesses including business cards, letterhead, brochures, and signage",
          "category": "Business Services"
        },
        "priceSpecification": {
          "@type": "PriceSpecification",
          "priceCurrency": "USD",
          "price": "Starting at $299"
        }
      },
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service",
          "name": "Custom Banner Design & Print",
          "description": "Professional banner design and printing for events, grand openings, and promotional campaigns",
          "category": "Advertising"
        },
        "priceSpecification": {
          "@type": "PriceSpecification",
          "priceCurrency": "USD",
          "price": "Starting at $89"
        }
      }
    ]
  },
  "amenityFeature": [
    {"@type": "LocationFeatureSpecification", "name": "Free Parking", "value": true},
    {"@type": "LocationFeatureSpecification", "name": "Wheelchair Accessible", "value": true},
    {"@type": "LocationFeatureSpecification", "name": "Rush Orders Available", "value": true},
    {"@type": "LocationFeatureSpecification", "name": "Design Services", "value": true},
    {"@type": "LocationFeatureSpecification", "name": "Delivery Available", "value": true}
  ],
  "knowsAbout": [
    "Business Card Printing",
    "Banner Design", 
    "Real Estate Marketing",
    "Vinyl Signage",
    "Promotional Products",
    "Large Format Printing",
    "Marketing Consultation"
  ]
}
</script>

    <span itemprop="name">BE SEEN</span>
    <div itemprop="contactPoint" itemscope itemtype="https://schema.org/ContactPoint">
      <span itemprop="telephone">(669) 272-2682</span>
      <span itemprop="contactType">Customer Service</span>
      <span itemprop="areaServed">Santa Clara, CA</span>
    </div>
    <span itemprop="description">Professional printing services specializing in business marketing materials and real estate signage</span>
  </div>
</div>

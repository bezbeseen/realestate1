<!-- Analytics Loader - Comprehensive Tracking System -->
<!-- Old analytics code removed - now using smart multi-domain configuration below -->

<!-- Base Analytics Tracker -->
<script src="/assets/js/analytics-tracker.js"></script>

<!-- Enhanced BeSeen Business Analytics -->
<script src="/assets/js/enhanced-analytics.js"></script>

<!-- Analytics Configuration & Initialization -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('🚀 Analytics System Fully Loaded');
    
    // Enhanced tracking for BeSeen specific elements
    setupBeSeenSpecificTracking();
});

function setupBeSeenSpecificTracking() {
    // Track phone number clicks specifically
    document.addEventListener('click', function(e) {
        if (e.target.closest('a[href^="tel:"]')) {
            const phoneNumber = e.target.closest('a').getAttribute('href').replace('tel:', '');
            gtag('event', 'phone_call_click', {
                'phone_number': phoneNumber,
                'page_location': window.location.href,
                'event_category': 'contact'
            });
        }
    });

    // Track email clicks specifically  
    document.addEventListener('click', function(e) {
        if (e.target.closest('a[href^="mailto:"]')) {
            const email = e.target.closest('a').getAttribute('href').replace('mailto:', '');
            gtag('event', 'email_click', {
                'email_address': email,
                'page_location': window.location.href,
                'event_category': 'contact'
            });
        }
    });

    // Track external link clicks (Promo Store, Login, etc.)
    document.addEventListener('click', function(e) {
        const link = e.target.closest('a');
        if (link && link.getAttribute('href')) {
            const href = link.getAttribute('href');
            const isExternal = href.startsWith('http') && !href.includes(window.location.hostname);
            
            if (isExternal) {
                gtag('event', 'external_link_click', {
                    'link_url': href,
                    'link_text': link.textContent.trim(),
                    'page_location': window.location.href,
                    'event_category': 'outbound'
                });
            }
        }
    });

    // Track cart interactions
    document.addEventListener('click', function(e) {
        if (e.target.closest('.cart_btn')) {
            gtag('event', 'cart_open_attempt', {
                'page_location': window.location.href,
                'event_category': 'ecommerce'
            });
        }
    });

    // Enhanced CTA Tracking - Track all Call-to-Action buttons
    document.addEventListener('click', function(e) {
        const element = e.target.closest('a, button');
        if (!element) return;
        
        const href = element.getAttribute('href') || '';
        const text = element.textContent.trim().toLowerCase();
        const classes = element.className || '';
        const pageInfo = getDescriptivePageInfo();
        
        // Quote/Get Quote buttons
        if (text.includes('quote') || text.includes('get quote') || classes.includes('quote')) {
            gtag('event', 'cta_quote_request', {
                'button_text': element.textContent.trim(),
                'page_category': pageInfo.category,
                'page_description': pageInfo.description,
                'conversion_intent': 'very_high',
                'cta_type': 'quote_request',
                'event_category': 'cta_conversion'
            });
        }
        
        // Contact Us buttons
        else if (text.includes('contact') || text.includes('contact us') || href.includes('contact')) {
            gtag('event', 'cta_contact', {
                'button_text': element.textContent.trim(),
                'page_category': pageInfo.category,
                'page_description': pageInfo.description,
                'conversion_intent': 'high',
                'cta_type': 'contact_request',
                'event_category': 'cta_conversion'
            });
        }
        
        // Call Now / Phone buttons
        else if (text.includes('call') || text.includes('phone') || href.includes('tel:')) {
            gtag('event', 'cta_call_now', {
                'button_text': element.textContent.trim(),
                'phone_number': href.replace('tel:', ''),
                'page_category': pageInfo.category,
                'page_description': pageInfo.description,
                'conversion_intent': 'very_high',
                'cta_type': 'phone_call',
                'event_category': 'cta_conversion'
            });
        }
        
        // Learn More / View Details buttons
        else if (text.includes('learn more') || text.includes('view details') || text.includes('read more')) {
            gtag('event', 'cta_learn_more', {
                'button_text': element.textContent.trim(),
                'page_category': pageInfo.category,
                'page_description': pageInfo.description,
                'conversion_intent': 'medium',
                'cta_type': 'engagement',
                'event_category': 'cta_engagement'
            });
        }
        
        // Shop Now / Order Now buttons
        else if (text.includes('shop') || text.includes('order') || text.includes('buy now')) {
            gtag('event', 'cta_shop_now', {
                'button_text': element.textContent.trim(),
                'page_category': pageInfo.category,
                'page_description': pageInfo.description,
                'conversion_intent': 'very_high',
                'cta_type': 'purchase_intent',
                'event_category': 'cta_ecommerce'
            });
        }
        
        // Get Started / Start Project buttons
        else if (text.includes('get started') || text.includes('start') || text.includes('begin')) {
            gtag('event', 'cta_get_started', {
                'button_text': element.textContent.trim(),
                'page_category': pageInfo.category,
                'page_description': pageInfo.description,
                'conversion_intent': 'high',
                'cta_type': 'project_start',
                'event_category': 'cta_conversion'
            });
        }
        
        // Download buttons (catalogs, price lists, etc.)
        else if (text.includes('download') || href.includes('.pdf') || href.includes('.doc')) {
            gtag('event', 'cta_download', {
                'button_text': element.textContent.trim(),
                'download_url': href,
                'page_category': pageInfo.category,
                'page_description': pageInfo.description,
                'conversion_intent': 'medium',
                'cta_type': 'resource_download',
                'event_category': 'cta_engagement'
            });
        }
        
        // Navigation CTAs (Browse Products, View Services, etc.)
        else if (text.includes('browse') || text.includes('view all') || text.includes('see more')) {
            gtag('event', 'cta_browse', {
                'button_text': element.textContent.trim(),
                'destination_url': href,
                'page_category': pageInfo.category,
                'page_description': pageInfo.description,
                'conversion_intent': 'low',
                'cta_type': 'navigation',
                'event_category': 'cta_navigation'
            });
        }
        
        // Primary action buttons (based on common CSS classes)
        else if (classes.includes('btn-primary') || classes.includes('cta') || classes.includes('action')) {
            gtag('event', 'cta_primary_action', {
                'button_text': element.textContent.trim(),
                'button_class': classes,
                'page_category': pageInfo.category,
                'page_description': pageInfo.description,
                'conversion_intent': 'high',
                'cta_type': 'primary_action',
                'event_category': 'cta_conversion'
            });
        }
        
        // Generic important links (if they have specific styling or are in key locations)
        else if (classes.includes('important') || classes.includes('highlight') || element.closest('.hero, .banner, .cta-section')) {
            gtag('event', 'cta_featured_link', {
                'button_text': element.textContent.trim(),
                'destination_url': href,
                'page_category': pageInfo.category,
                'page_description': pageInfo.description,
                'conversion_intent': 'medium',
                'cta_type': 'featured_link',
                'event_category': 'cta_engagement'
            });
        }
    });

    // Track login button clicks
    document.addEventListener('click', function(e) {
        if (e.target.closest('.login')) {
            gtag('event', 'cta_login', {
                'page_location': window.location.href,
                'page_description': getDescriptivePageInfo().description,
                'cta_type': 'account_access',
                'event_category': 'cta_engagement'
            });
        }
    });
    
    // Track specific business CTAs
    document.addEventListener('click', function(e) {
        const element = e.target.closest('a, button');
        if (!element) return;
        
        const text = element.textContent.trim().toLowerCase();
        const href = element.getAttribute('href') || '';
        const pageInfo = getDescriptivePageInfo();
        
        // Portfolio/Gallery CTAs
        if (text.includes('portfolio') || text.includes('gallery') || text.includes('examples')) {
            gtag('event', 'cta_view_portfolio', {
                'button_text': element.textContent.trim(),
                'page_category': pageInfo.category,
                'conversion_intent': 'medium',
                'cta_type': 'portfolio_view',
                'event_category': 'cta_engagement'
            });
        }
        
        // Pricing CTAs
        else if (text.includes('pricing') || text.includes('price') || text.includes('cost')) {
            gtag('event', 'cta_pricing_inquiry', {
                'button_text': element.textContent.trim(),
                'page_category': pageInfo.category,
                'conversion_intent': 'high',
                'cta_type': 'pricing_request',
                'event_category': 'cta_conversion'
            });
        }
        
        // Social media CTAs
        else if (href.includes('facebook') || href.includes('instagram') || href.includes('linkedin') || href.includes('twitter')) {
            gtag('event', 'cta_social_media', {
                'button_text': element.textContent.trim(),
                'social_platform': href.includes('facebook') ? 'facebook' : 
                                  href.includes('instagram') ? 'instagram' :
                                  href.includes('linkedin') ? 'linkedin' : 'other',
                'page_category': pageInfo.category,
                'cta_type': 'social_follow',
                'event_category': 'cta_social'
            });
        }
        
        // Newsletter/Email signup CTAs
        else if (text.includes('newsletter') || text.includes('subscribe') || text.includes('email updates')) {
            gtag('event', 'cta_newsletter_signup', {
                'button_text': element.textContent.trim(),
                'page_category': pageInfo.category,
                'conversion_intent': 'medium',
                'cta_type': 'email_signup',
                'event_category': 'cta_engagement'
            });
        }
        
        // Location/Directions CTAs
        else if (text.includes('directions') || text.includes('location') || text.includes('find us')) {
            gtag('event', 'cta_get_directions', {
                'button_text': element.textContent.trim(),
                'page_category': pageInfo.category,
                'conversion_intent': 'high',
                'cta_type': 'location_visit',
                'event_category': 'cta_conversion'
            });
        }
    });

    // Enhanced Navigation Tracking
    document.addEventListener('click', function(e) {
        const element = e.target.closest('a');
        if (!element) return;
        
        const href = element.getAttribute('href') || '';
        const text = element.textContent.trim();
        const pageInfo = getDescriptivePageInfo();
        
        // Skip if already tracked by CTA handlers above
        if (element.dataset.ctaTracked) return;
        
        // Main navigation menu tracking
        if (element.closest('nav, .navbar, .main-menu, .navigation')) {
            gtag('event', 'navigation_main_menu', {
                'nav_item_text': text,
                'nav_destination': href,
                'current_page': pageInfo.description,
                'nav_type': 'main_menu',
                'event_category': 'navigation'
            });
        }
        
        // Footer navigation
        else if (element.closest('footer, .footer')) {
            gtag('event', 'navigation_footer', {
                'nav_item_text': text,
                'nav_destination': href,
                'current_page': pageInfo.description,
                'nav_type': 'footer',
                'event_category': 'navigation'
            });
        }
        
        // Breadcrumb navigation
        else if (element.closest('.breadcrumb, .breadcrumbs')) {
            gtag('event', 'navigation_breadcrumb', {
                'nav_item_text': text,
                'nav_destination': href,
                'current_page': pageInfo.description,
                'nav_type': 'breadcrumb',
                'event_category': 'navigation'
            });
        }
        
        // Logo clicks (back to homepage)
        else if (element.closest('.logo') || href === '/' || href === '/index.html') {
            gtag('event', 'navigation_logo_home', {
                'nav_item_text': text || 'Logo',
                'current_page': pageInfo.description,
                'nav_type': 'logo',
                'event_category': 'navigation'
            });
        }
        
        // Product category navigation
        else if (href.includes('/products/') && !href.includes('.html')) {
            gtag('event', 'navigation_product_category', {
                'nav_item_text': text,
                'product_category': href.split('/').pop(),
                'current_page': pageInfo.description,
                'nav_type': 'product_category',
                'event_category': 'navigation'
            });
        }
        
        // Service category navigation  
        else if (href.includes('/services/') && !href.includes('.html')) {
            gtag('event', 'navigation_service_category', {
                'nav_item_text': text,
                'service_category': href.split('/').pop(),
                'current_page': pageInfo.description,
                'nav_type': 'service_category',
                'event_category': 'navigation'
            });
        }
        
        // Internal page navigation (any internal link not caught above)
        else if (!href.startsWith('http') && !href.startsWith('mailto:') && !href.startsWith('tel:') && href !== '') {
            gtag('event', 'navigation_internal_link', {
                'nav_item_text': text,
                'nav_destination': href,
                'current_page': pageInfo.description,
                'nav_type': 'internal',
                'event_category': 'navigation'
            });
        }
        
        // Mark as tracked to avoid duplicate tracking
        element.dataset.ctaTracked = 'true';
    });

    // Track search functionality if present
    document.addEventListener('submit', function(e) {
        if (e.target.matches('form[role="search"], .search-form')) {
            const searchTerm = e.target.querySelector('input[type="search"], input[name="search"], input[name="q"]')?.value;
            if (searchTerm) {
                gtag('event', 'search', {
                    'search_term': searchTerm,
                    'event_category': 'site_search'
                });
            }
        }
    });

    // Track video interactions if present
    document.addEventListener('play', function(e) {
        if (e.target.tagName === 'VIDEO') {
            gtag('event', 'video_play', {
                'video_title': e.target.title || 'Unknown Video',
                'event_category': 'video'
            });
        }
    }, true);

    // Track PDF/Document downloads
    document.addEventListener('click', function(e) {
        const link = e.target.closest('a');
        if (link && link.getAttribute('href')) {
            const href = link.getAttribute('href');
            const isDownload = /\.(pdf|doc|docx|xls|xlsx|ppt|pptx|zip|rar)$/i.test(href);
            
            if (isDownload) {
                gtag('event', 'file_download', {
                    'file_name': href.split('/').pop(),
                    'file_type': href.split('.').pop().toLowerCase(),
                    'link_text': link.textContent.trim(),
                    'event_category': 'download'
                });
            }
        }
    });

    // Track scroll depth milestones
    let scrollDepthMarkers = [25, 50, 75, 100];
    let scrollDepthReached = [];
    
    window.addEventListener('scroll', function() {
        const scrollPercent = Math.round((window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100);
        
        scrollDepthMarkers.forEach(function(marker) {
            if (scrollPercent >= marker && !scrollDepthReached.includes(marker)) {
                scrollDepthReached.push(marker);
                gtag('event', 'scroll_depth', {
                    'percent_scrolled': marker,
                    'event_category': 'engagement'
                });
            }
        });
    });

    // Track time on page milestones
    const timeMarkers = [30, 60, 120, 300, 600]; // 30s, 1m, 2m, 5m, 10m
    let timeMarkersReached = [];
    const startTime = Date.now();

    timeMarkers.forEach(function(marker) {
        setTimeout(function() {
            if (!document.hidden) {
                timeMarkersReached.push(marker);
                gtag('event', 'time_on_page', {
                    'time_seconds': marker,
                    'event_category': 'engagement'
                });
            }
        }, marker * 1000);
    });

    // Track page visibility changes
    document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
            const timeOnPage = Math.round((Date.now() - startTime) / 1000);
            gtag('event', 'page_hidden', {
                'time_on_page': timeOnPage,
                'event_category': 'engagement'
            });
        } else {
            gtag('event', 'page_visible', {
                'event_category': 'engagement'
            });
        }
    });

    // Enhanced Form Tracking with Lead Scoring
    document.addEventListener('submit', function(e) {
        const form = e.target;
        if (form.tagName === 'FORM') {
            const formName = form.name || form.id || 'unnamed_form';
            const formData = new FormData(form);
            const fieldCount = Array.from(formData.keys()).length;
            const pageInfo = getDescriptivePageInfo();
            
            // Extract form data for lead scoring
            const email = formData.get('email') || formData.get('Email') || '';
            const phone = formData.get('phone') || formData.get('Phone') || '';
            const company = formData.get('company') || formData.get('Company') || '';
            const message = formData.get('message') || formData.get('Message') || '';
            
            // Generate unique lead ID if this is a conversion form
            const leadId = generateLeadId();
            
            // Store lead info in localStorage for cross-session tracking
            if (email || phone) {
                const leadData = {
                    leadId: leadId,
                    email: email,
                    phone: phone,
                    company: company,
                    firstContact: new Date().toISOString(),
                    formPage: pageInfo.description,
                    leadScore: calculateLeadScore(formData, pageInfo)
                };
                localStorage.setItem('beseen_lead_' + leadId, JSON.stringify(leadData));
                localStorage.setItem('beseen_current_lead', leadId);
            }
            
            gtag('event', 'form_submit_enhanced', {
                'form_name': formName,
                'form_fields': fieldCount,
                'page_category': pageInfo.category,
                'page_description': pageInfo.description,
                'has_email': !!email,
                'has_phone': !!phone,
                'has_company': !!company,
                'message_length': message.length,
                'lead_id': leadId,
                'lead_score': calculateLeadScore(formData, pageInfo),
                'conversion_value': pageInfo.conversionScore,
                'event_category': 'form_conversion'
            });
            
            // Track as high-value conversion
            gtag('event', 'conversion', {
                'currency': 'USD',
                'value': pageInfo.conversionScore * 10, // Assign dollar value to conversion
                'conversion_type': 'lead_generation',
                'lead_quality': calculateLeadScore(formData, pageInfo),
                'source_page': pageInfo.description
            });
        }
    });
    
    // Form abandonment tracking
    document.addEventListener('focusout', function(e) {
        if (e.target.matches('input, textarea, select')) {
            const form = e.target.closest('form');
            if (form) {
                // Track that user started filling a form
                if (!form.dataset.formStarted) {
                    form.dataset.formStarted = 'true';
                    gtag('event', 'form_start', {
                        'form_name': form.name || form.id || 'unnamed_form',
                        'page_description': getDescriptivePageInfo().description,
                        'event_category': 'form_engagement'
                    });
                }
                
                // Track form progress
                const totalFields = form.querySelectorAll('input, textarea, select').length;
                const filledFields = Array.from(form.querySelectorAll('input, textarea, select')).filter(field => field.value.trim() !== '').length;
                const progressPercent = Math.round((filledFields / totalFields) * 100);
                
                gtag('event', 'form_progress', {
                    'form_name': form.name || form.id || 'unnamed_form',
                    'progress_percent': progressPercent,
                    'filled_fields': filledFields,
                    'total_fields': totalFields,
                    'event_category': 'form_engagement'
                });
            }
        }
    });

    // Track error events
    window.addEventListener('error', function(e) {
        gtag('event', 'javascript_error', {
            'error_message': e.message,
            'error_source': e.filename,
            'error_line': e.lineno,
            'event_category': 'error'
        });
    });

    // Track unhandled promise rejections
    window.addEventListener('unhandledrejection', function(e) {
        gtag('event', 'promise_rejection', {
            'error_reason': e.reason,
            'event_category': 'error'
        });
    });
}

// Performance monitoring
window.addEventListener('load', function() {
    // Track page load time
    setTimeout(function() {
        const perfData = performance.getEntriesByType('navigation')[0];
        if (perfData) {
            gtag('event', 'page_load_time', {
                'load_time': Math.round(perfData.loadEventEnd - perfData.loadEventStart),
                'dom_ready_time': Math.round(perfData.domContentLoadedEventEnd - perfData.domContentLoadedEventStart),
                'event_category': 'performance'
            });
        }
    }, 0);
});

// Track custom BeSeen events
function trackCustomEvent(eventName, parameters = {}) {
    gtag('event', eventName, {
        ...parameters,
        'custom_tracking': true,
        'site_section': getBeSeeenSiteSection()
    });
}

function getBeSeeenSiteSection() {
    const path = window.location.pathname;
    if (path.includes('/products/')) return 'products';
    if (path.includes('/services/')) return 'services';
    if (path.includes('/about')) return 'about';
    if (path.includes('/contact')) return 'contact';
    if (path === '/' || path === '/index.html') return 'home';
    return 'other';
}

// Make tracking function globally available
window.trackCustomEvent = trackCustomEvent;

// Log analytics initialization
console.log('📊 BeSeen Analytics System Initialized');
console.log('📋 Tracking: Page views, clicks, forms, scrolling, time on page, errors, performance');
console.log('🎯 Business Events: Phone calls, emails, cart, login, downloads, videos');
console.log('📱 Enhanced: Mobile interactions, product views, lead scoring');
</script>

<!-- Development Analytics Dashboard Toggle -->
<script>
if (window.location.hostname === 'localhost' || window.location.hostname.includes('dev') || window.location.search.includes('debug=analytics')) {
    // Add analytics debug panel
    document.addEventListener('DOMContentLoaded', function() {
        const debugPanel = document.createElement('div');
        debugPanel.innerHTML = `
            <div id="analytics-debug" style="
                position: fixed;
                bottom: 20px;
                left: 20px;
                background: rgba(0,0,0,0.9);
                color: white;
                padding: 15px;
                border-radius: 8px;
                font-family: monospace;
                font-size: 12px;
                z-index: 999999;
                max-width: 400px;
                max-height: 300px;
                overflow-y: auto;
                display: none;
            ">
                <h4 style="margin: 0 0 10px 0;">🔍 Analytics Debug Panel</h4>
                <div id="debug-events"></div>
                <button onclick="clearDebugEvents()" style="margin-top: 10px; padding: 5px 10px; background: #007cba; color: white; border: none; border-radius: 3px; cursor: pointer;">Clear</button>
            </div>
            <button onclick="toggleDebugPanel()" style="
                position: fixed;
                bottom: 20px;
                left: 20px;
                background: #007cba;
                color: white;
                border: none;
                border-radius: 50%;
                width: 50px;
                height: 50px;
                cursor: pointer;
                z-index: 1000000;
                font-size: 20px;
            ">📊</button>
        `;
        document.body.appendChild(debugPanel);

        // Override gtag to capture events in debug panel
        const originalGtag = window.gtag;
        window.gtag = function() {
            originalGtag.apply(window, arguments);
            
            if (arguments[0] === 'event') {
                addDebugEvent(arguments[1], arguments[2]);
            }
        };

        window.toggleDebugPanel = function() {
            const panel = document.getElementById('analytics-debug');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        };

        window.clearDebugEvents = function() {
            document.getElementById('debug-events').innerHTML = '';
        };

        window.addDebugEvent = function(eventName, parameters) {
            const debugEvents = document.getElementById('debug-events');
            if (debugEvents) {
                const eventDiv = document.createElement('div');
                eventDiv.style.cssText = 'margin: 5px 0; padding: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; font-size: 11px;';
                eventDiv.innerHTML = `
                    <strong>${eventName}</strong> <small>${new Date().toLocaleTimeString()}</small><br>
                    <small>${JSON.stringify(parameters, null, 2).substring(0, 100)}...</small>
                `;
                debugEvents.insertBefore(eventDiv, debugEvents.firstChild);
                
                // Keep only last 20 events
                while (debugEvents.children.length > 20) {
                    debugEvents.removeChild(debugEvents.lastChild);
                }
            }
        };
    });
}
</script>

<!-- Smart Page Detection & Auto-Tracking -->
<script>
function setupSmartPageTracking() {
    const pageType = detectPageType();
    const businessContext = getBusinessContext();
    
    // Auto-track based on page type
    gtag('event', 'smart_page_view', {
        'page_type': pageType,
        'business_category': businessContext.category,
        'product_focus': businessContext.product,
        'service_focus': businessContext.service,
        'conversion_potential': businessContext.conversionScore,
        'page_depth': getPageDepth(),
        'visit_sequence': getVisitSequence(),
        'event_category': 'smart_tracking'
    });
    
    // Set up page-specific auto-tracking
    switch(pageType) {
        case 'product_page':
            setupProductPageTracking(businessContext);
            break;
        case 'service_page':
            setupServicePageTracking(businessContext);
            break;
        case 'contact_page':
            setupContactPageTracking();
            break;
        case 'quote_page':
            setupQuotePageTracking();
            break;
        case 'homepage':
            setupHomepageTracking();
            break;
    }
}

function detectPageType() {
    const path = window.location.pathname.toLowerCase();
    const title = document.title.toLowerCase();
    
    // Product pages
    if (path.includes('/products/') || path.includes('/prints/') || path.includes('/signs/')) {
        return 'product_page';
    }
    
    // Service pages
    if (path.includes('/services/') || title.includes('service')) {
        return 'service_page';
    }
    
    // Contact/Quote pages
    if (path.includes('/contact') || path.includes('/quote') || title.includes('contact') || title.includes('quote')) {
        return path.includes('/quote') ? 'quote_page' : 'contact_page';
    }
    
    // Homepage
    if (path === '/' || path === '/index.html' || path === '') {
        return 'homepage';
    }
    
    // About/Company pages
    if (path.includes('/about') || title.includes('about')) {
        return 'about_page';
    }
    
    return 'general_page';
}

function getBusinessContext() {
    const path = window.location.pathname.toLowerCase();
    const title = document.title.toLowerCase();
    const content = document.body.textContent.toLowerCase();
    
    let category = 'general';
    let product = null;
    let service = null;
    let conversionScore = 1;
    
    // Detect product categories
    if (path.includes('/business-card') || title.includes('business card')) {
        category = 'business_cards';
        product = 'business_cards';
        conversionScore = 8; // High conversion potential
    } else if (path.includes('/banner') || path.includes('/sign')) {
        category = 'signage';
        product = 'banners_signs';
        conversionScore = 7;
    } else if (path.includes('/flyer') || path.includes('/brochure')) {
        category = 'marketing_materials';
        product = 'print_marketing';
        conversionScore = 6;
    } else if (path.includes('/promotional')) {
        category = 'promotional';
        product = 'promotional_items';
        conversionScore = 5;
    }
    
    // Detect services
    if (content.includes('graphic design') || title.includes('design')) {
        service = 'graphic_design';
        conversionScore += 2;
    } else if (content.includes('web design') || path.includes('/web')) {
        service = 'web_design';
        conversionScore += 3;
    } else if (content.includes('marketing') || content.includes('advertising')) {
        service = 'marketing';
        conversionScore += 2;
    }
    
    return { category, product, service, conversionScore: Math.min(conversionScore, 10) };
}

function getPageDepth() {
    const path = window.location.pathname;
    return (path.match(/\//g) || []).length;
}

function getVisitSequence() {
    const visited = sessionStorage.getItem('visited_pages');
    if (!visited) {
        sessionStorage.setItem('visited_pages', '1');
        return 1;
    }
    const count = parseInt(visited) + 1;
    sessionStorage.setItem('visited_pages', count.toString());
    return count;
}

// Generate unique lead ID
function generateLeadId() {
    return 'lead_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
}

// Calculate lead score based on form data and page context
function calculateLeadScore(formData, pageInfo) {
    let score = pageInfo.conversionScore || 5;
    
    // Boost score based on form completeness
    if (formData.get('email')) score += 2;
    if (formData.get('phone')) score += 3;
    if (formData.get('company')) score += 2;
    
    const message = formData.get('message') || '';
    if (message.length > 50) score += 2;
    if (message.length > 200) score += 1;
    
    // Boost based on urgency keywords
    if (message.toLowerCase().includes('urgent') || message.toLowerCase().includes('asap')) score += 2;
    if (message.toLowerCase().includes('budget') || message.toLowerCase().includes('quote')) score += 1;
    
    return Math.min(score, 10); // Cap at 10
}

// Enhanced user tracking with cookies
function initializeUserTracking() {
    const userId = getUserId();
    const sessionId = getSessionId();
    const visitCount = getVisitCount();
    
    // Track returning vs new users
    gtag('config', 'G-X2DMYVRCXD', {
        'user_id': userId,
        'custom_map': {
            'custom_parameter_1': 'user_type',

        }
    });
    
    // Set user properties
    gtag('event', 'user_engagement', {
        'user_id': userId,
        'session_id': sessionId,
        'visit_count': visitCount,
        'user_type': visitCount === 1 ? 'new_visitor' : 'returning_visitor',
        'previous_lead': localStorage.getItem('beseen_current_lead') || null,
        'user_journey_stage': getUserJourneyStage(visitCount),

    });
}

function getUserId() {

        userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('beseen_user_id', userId);

function getSessionId() {

        sessionStorage.setItem('beseen_session_id', sessionId);

    return sessionId;

function getVisitCount() {

    localStorage.setItem('beseen_visit_count', visitCount.toString());
    localStorage.setItem('beseen_last_visit', new Date().toISOString());
    return visitCount;
}

function getUserJourneyStage(visitCount) {
    if (visitCount === 1) return 'awareness';
    if (visitCount <= 3) return 'consideration';
    if (visitCount <= 7) return 'evaluation';
    return 'decision';
}

// Track user behavior patterns
function trackUserBehaviorPatterns() {
    const userId = getUserId();
    const pageInfo = getDescriptivePageInfo();
    
    // Track page sequence for user journey mapping
    const pageSequence = JSON.parse(sessionStorage.getItem('page_sequence') || '[]');
    pageSequence.push({
        page: pageInfo.description,
        timestamp: Date.now(),
        category: pageInfo.category
    });
    sessionStorage.setItem('page_sequence', JSON.stringify(pageSequence.slice(-10))); // Keep last 10 pages
    
    // Track time spent on different page types
    const pageStartTime = Date.now();
    sessionStorage.setItem('page_start_time', pageStartTime.toString());
    
    // Track when user leaves page
    window.addEventListener('beforeunload', function() {
        const timeSpent = Math.round((Date.now() - pageStartTime) / 1000);
        if (timeSpent > 5) { // Only track if spent more than 5 seconds
            gtag('event', 'page_time_detailed', {
                'page_description': pageInfo.description,
                'time_spent_seconds': timeSpent,
                'page_category': pageInfo.category,
                'conversion_potential': pageInfo.conversionScore,
                'user_id': userId,
                'event_category': 'engagement'
            });
        }
    });
}

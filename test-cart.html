<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Test - BE SEEN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/cart.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Cart System Test</h1>
        
        <!-- Test Product -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">A-Frame Signs</h5>
                <p class="card-text">Portable A-frame signs for temporary advertising</p>
                <p class="card-text"><strong>Price: $45.00</strong></p>
                <button class="btn btn-primary" onclick="testAddToCart()">Add to Cart</button>
            </div>
        </div>

        <!-- Cart Button -->
        <button class="btn btn-success" onclick="cart.checkout()">
            Checkout with Stripe <span class="cart_counter badge bg-light text-dark">0</span>
        </button>

        <!-- Test Results -->
        <div id="test-results" class="mt-4"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Stripe Integration -->
    <script src="https://js.stripe.com/v3/"></script>
    
    <!-- Cart System -->
    <script src="/assets/js/cart.js"></script>

    <script>
        function testAddToCart() {
            cart.addItem({
                id: 'test-a-frames',
                name: 'A-Frame Signs',
                price: 45.00,
                image: '/assets/images/signs/a-frames.jpg'
            });
            
            document.getElementById('test-results').innerHTML = 
                '<div class="alert alert-success">Item added to cart! Check the cart counter.</div>';
        }

        // Initialize cart when page loads
        document.addEventListener('DOMContentLoaded', function() {
            if (window.cart) {
                console.log('Cart system loaded successfully');
            } else {
                console.error('Cart system failed to load');
            }
        });
    </script>
</body>
</html>

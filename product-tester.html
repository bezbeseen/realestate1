<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page Tester</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/product-pages.css">
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.7/dist/handlebars.min.js"></script>
</head>
<body>
    <div id="product-container"></div>

    <script src="generated/includes/image-library.js"></script>
    <script src="includes/image-helpers.html"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('product');

            if (!productId) {
                document.getElementById('product-container').innerHTML = '<h1>Please specify a product ID in the URL, like ?product=business-cards</h1>';
                return;
            }

            try {
                const [productResponse, templateResponse] = await Promise.all([
                    fetch('data/products.json'),
                    fetch('templates/product-template.html')
                ]);

                const products = await productResponse.json();
                const templateHtml = await templateResponse.text();

                const product = products.find(p => p.product_id === productId);

                if (product) {
                    const template = Handlebars.compile(templateHtml);
                    const renderedHtml = template(product);
                    document.getElementById('product-container').innerHTML = renderedHtml;
                } else {
                    document.getElementById('product-container').innerHTML = `<h1>Product "${productId}" not found.</h1>`;
                }
            } catch (error) {
                console.error('Error loading product data or template:', error);
                document.getElementById('product-container').innerHTML = '<h1>Error loading product data. Please check the console.</h1>';
            }
        });
    </script>
</body>
</html>

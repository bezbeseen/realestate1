// 🛠️ IMAGE UTILITY FUNCTIONS
const ImageUtils = {
    // Get image path by category and name
    getImagePath: function(category, imageName) {
        if (IMAGE_LIBRARY[category] && IMAGE_LIBRARY[category][imageName]) {
            return IMAGE_LIBRARY[category][imageName];
        }
        console.warn(`Image not found: ${category}.${imageName}`);
        return "/assets/images/placeholder.svg";
    },
    
    // Get product image by product ID
    getProductImage: function(productId) {
        const productMap = {
            'business_cards': IMAGE_LIBRARY.products.prints.businessCards,
            'banners': IMAGE_LIBRARY.products.prints.banners,
            'brochures': IMAGE_LIBRARY.products.prints.brochures,
            'flyers': IMAGE_LIBRARY.products.prints.flyers,
            'posters': IMAGE_LIBRARY.products.prints.posters,
            'stickers': IMAGE_LIBRARY.products.prints.stickers,
            'canvas_prints': IMAGE_LIBRARY.products.prints.canvas,
            'photos': IMAGE_LIBRARY.products.prints.photos,
            'a_frames': IMAGE_LIBRARY.products.signs.aFrame,
            'channel_lettering': IMAGE_LIBRARY.products.signs.channelLetters,
            'yard_signs': IMAGE_LIBRARY.products.signs.yardSigns,
            'window_graphics': IMAGE_LIBRARY.products.signs.windowGraphics,
            'aluminum_signs': IMAGE_LIBRARY.products.signs.aluminumSigns,
            'magnets': IMAGE_LIBRARY.products.signs.magnets,
            'flags': IMAGE_LIBRARY.products.promotional.flags,
            'tents': IMAGE_LIBRARY.products.promotional.tents,
            'table_cloths': IMAGE_LIBRARY.products.promotional.tableCloths,
            'branded_apparel': IMAGE_LIBRARY.products.promotional.apparel,
            'pens': IMAGE_LIBRARY.products.promotional.pens,
            'bags': IMAGE_LIBRARY.products.promotional.bags,
            'booths': IMAGE_LIBRARY.products.promotional.booths
        };
        
        return productMap[productId] || "/assets/images/placeholder.svg";
    },
    
    // Get service image by service ID
    getServiceImage: function(serviceId) {
        const serviceMap = {
            'graphic_design': IMAGE_LIBRARY.services.graphicDesign,
            'web_design': IMAGE_LIBRARY.services.webDesign,
            'mailing': IMAGE_LIBRARY.services.mailing
        };
        
        return serviceMap[serviceId] || "/assets/images/placeholder.svg";
    },
    
    // Get breadcrumb background by category
    getBreadcrumbImage: function(category) {
        const breadcrumbMap = {
            'prints': IMAGE_LIBRARY.breadcrumbs.bg02,
            'signs': IMAGE_LIBRARY.breadcrumbs.bg03,
            'promotional': IMAGE_LIBRARY.breadcrumbs.bg01,
            'materials': IMAGE_LIBRARY.breadcrumbs.bg02,
            'real-estate': IMAGE_LIBRARY.breadcrumbs.bg02
        };
        
        return breadcrumbMap[category] || IMAGE_LIBRARY.breadcrumbs.bg01;
    },
    
    // Get review image path
    getReviewImagePath: function(category, imageName) {
        if (IMAGE_LIBRARY.review.categories[category]) {
            return IMAGE_LIBRARY.review.categories[category] + imageName;
        }
        return IMAGE_LIBRARY.review.basePath + imageName;
    },
    
    // Get specific review image by category and type
    getReviewImage: function(category, imageType) {
        if (IMAGE_LIBRARY.review.images[category] && IMAGE_LIBRARY.review.images[category][imageType]) {
            return IMAGE_LIBRARY.review.images[category][imageType];
        }
        return "/assets/images/placeholder.svg";
    },
    
    // Get all review images for a category
    getReviewImagesForCategory: function(category) {
        if (IMAGE_LIBRARY.review.images[category]) {
            return IMAGE_LIBRARY.review.images[category];
        }
        return {};
    },
    
    // Get all review categories
    getReviewCategories: function() {
        return Object.keys(IMAGE_LIBRARY.review.categories);
    },
    
    // Check if image exists
    imageExists: function(imagePath) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve(true);
            img.onerror = () => resolve(false);
            img.src = imagePath;
        });
    },
    
    // Fallback to placeholder if image doesn't exist
    getImageWithFallback: async function(imagePath, fallbackPath = "/assets/images/placeholder.svg") {
        const exists = await this.imageExists(imagePath);
        return exists ? imagePath : fallbackPath;
    }
};

// 🌐 GLOBAL IMAGE FUNCTIONS (for use in templates)

<VirtualHost *:80>
    ServerName images.getbeseen.com
    ServerAlias www.images.getbeseen.com
    DocumentRoot /Users/bezmorid/GIT HTML/realestate1/nextcloud
    
    # Enable rewrite engine
    RewriteEngine On
    
    # Redirect HTTP to HTTPS (uncomment when SSL is configured)
    # RewriteCond %{HTTPS} off
    # RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
    
    # Nextcloud specific configurations
    <Directory "/Users/bezmorid/GIT HTML/realestate1/nextcloud">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        
        # Enable PHP
        <FilesMatch "\.php$">
            SetHandler application/x-httpd-php
        </FilesMatch>
    </Directory>
    
    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Log files
    ErrorLog "/Users/bezmorid/GIT HTML/realestate1/nextcloud/logs/error.log"
    CustomLog "/Users/bezmorid/GIT HTML/realestate1/nextcloud/logs/access.log" combined
</VirtualHost>


<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>Business Cards | Professional Printing | BE SEEN</title>
	<meta name="description" content="High-quality business cards in various stocks and finishes. Professional printing for your brand.">
	
	<!-- CSS Includes -->
	<link rel="stylesheet" type="text/css" href="/assets/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="/assets/css/style.css">
	<link rel="stylesheet" type="text/css" href="/assets/css/product-pages.css">

	<!-- Image Library -->
	<script>
        const IMAGE_LIBRARY = {
            "products": {
                "businessCards": {
                    "standard": {
                        "path": "/assets/Be seen image review updated/Business cards/standard business card.jpg",
                        "alt": "Standard business cards with clean professional design for real estate marketing",
                        "variable": "PRODUCTS_BUSINESS_CARDS_STANDARD"
                    }
                }
            }
        };

        function getProductImage(productId) {
            if (productId === 'business_cards') {
                return IMAGE_LIBRARY.products.businessCards.standard.path;
            }
            return '/assets/images/placeholder.jpg';
        }
    </script>
</head>
<body>
	<!-- Header -->
	{{> header-with-analytics}}

	<!-- Breadcrumb -->
	<section class="breadcrumb_section d-flex align-items-center clearfix" 
	         style="background-image: url('/assets/Be seen image review updated/Business cards/standard business card.jpg')">
		<div class="container">
			<div class="row">
				<div class="col-12">
					<h1 class="page_title mb-0">Business Cards</h1>
					<p class="mb-0 subtitle-text text-white">High-quality business cards in various stocks and finishes. Professional printing for your brand.</p>
				</div>
			</div>
		</div>
	</section>

	<!-- Product Details -->
	<section class="details_section sec_ptb_130 bg_gray clearfix">
		<div class="container">
			<div class="row">
				<div class="col-lg-7">
					<!-- Product Gallery -->
					<div class="details_image_wrap">
						<div class="tab-content" id="productTabContent">
							<div id="main1" class="tab-pane active">
								<img src="/assets/Be seen image review updated/Business cards/standard business card.jpg" alt="Business Card Example">
							</div>
						</div>
					</div>

					<!-- Thumbnail Nav -->
					<div class="mt-3">
						<ul class="nav ul_li product_image_nav" id="productTab" role="tablist">
							<li>
								<a class="active" data-bs-toggle="tab" href="#main1">
									<img src="/assets/Be seen image review updated/Business cards/standard business card.jpg" alt="Business Card Example">
									<span class="thumbnail-label">Standard</span>
								</a>
							</li>
						</ul>
					</div>
				</div>

				<div class="col-lg-5">
					<div class="details_content product-container" 
						 data-product-id="business_cards"
						 data-product-name="Business Cards"
						 data-product-price="25.00" 
						 data-product-image="/assets/Be seen image review updated/Business cards/standard business card.jpg">
						<h2 class="item_title mb_15">Business Cards</h2>
						<span class="price_text mb_30"><strong>$25.00</strong></span>
						<p class="mb_15">
							Professional business cards available in a variety of stocks and finishes.
						</p>
					</div>
				</div>
			</div>
		</div>
	</section>

	<!-- Scripts -->
	<script src="/assets/js/jquery-3.5.1.min.js"></script>
	<script src="/assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
